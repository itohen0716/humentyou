<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>文化譜面帳｜絲庵 v1.4</title>
<style>
:root{--bg:#f5efe7;--paper:#fffdfa;--ink:#2e251f;--line:#dfd0c1;--blue:#4b879d;--blue2:#e8f3f6}
*{box-sizing:border-box} body{margin:0;background:var(--bg);color:var(--ink);font-family:"Yu Mincho","Hiragino Mincho ProN","Noto Serif JP",serif}
.app{max-width:980px;margin:auto;padding:10px 18px 36px}
header{display:flex;align-items:flex-start;justify-content:space-between;gap:16px;border-bottom:1px solid var(--line);padding-bottom:10px}
.brand h1{font-size:25px;font-weight:500;margin:0 0 5px}.subline{display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.en{font:10px/1.2 Arial,sans-serif;letter-spacing:.22em;color:#9a725d}.desc{font-size:12px;color:#77675d}
.add{border:0;border-radius:9px;background:var(--blue);color:white;font-weight:700;padding:12px 17px;cursor:pointer;white-space:nowrap}
.tools{padding:16px 0 8px}.kana{display:flex;gap:7px;flex-wrap:wrap;justify-content:center}
.kana button{min-width:36px;height:32px;border:1px solid var(--line);background:var(--paper);border-radius:18px;font-size:14px;cursor:pointer}
.kana button.active{background:#30271f;color:#fff;border-color:#30271f}.search{display:block;width:min(360px,100%);margin:9px auto 0;border:1px solid var(--line);border-radius:9px;background:white;padding:10px 13px;font-size:14px}
.list{display:grid;gap:9px}.card{min-height:55px;background:var(--paper);border:1px solid var(--line);border-radius:13px;box-shadow:0 1px 3px #0000000d;padding:10px 14px;display:flex;align-items:center;gap:12px}
.title{font-size:17px;flex:1;min-width:120px}.actions{display:flex;align-items:center;gap:7px}.actions button{border:1px solid var(--line);background:#fff;border-radius:7px;padding:9px 12px;font-weight:700;color:#43362e}
.actions .view{background:var(--blue2);border-color:#9fc1ce;color:#315f70}.delete{font-size:10px!important;border:0!important;background:transparent!important;color:#8a776b!important;padding:4px!important}
.empty{text-align:center;color:#8a776b;padding:42px 10px;font-size:14px}
.popup-overlay{position:fixed;inset:0;z-index:9999;display:none;background:rgba(43,35,29,.55)}
.popup-overlay.open{display:block}
.popup-center{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);width:calc(100% - 36px);max-width:460px}
.popup-card{display:block;width:100%;background:#fffdfa;border:1px solid #d8c6b5;border-radius:16px;box-shadow:0 18px 55px rgba(0,0,0,.38);padding:24px 26px 22px}
.popup-card h2{font-size:21px;font-weight:600;margin:0 0 18px;border-bottom:1px solid #eadfd4;padding-bottom:12px}
.field{margin:14px 0}.field label{display:block;font-size:12px;font-weight:700;margin-bottom:6px;color:#67574d}
.field input{width:100%;padding:11px 12px;border:1px solid var(--line);border-radius:8px;font-size:15px;background:white}
.song-name{padding:10px 12px;background:#f3ece4;border:1px solid #e2d4c7;border-radius:8px;font-size:16px;line-height:1.45;word-break:break-word}
.modal-actions{display:flex;justify-content:flex-end;gap:9px;margin-top:19px}.modal-actions button{padding:9px 16px;border-radius:8px;border:1px solid var(--line);background:#fff;cursor:pointer}.modal-actions .primary{background:var(--blue);border-color:var(--blue);color:white;font-weight:700}
.note{font-size:12px;color:#7d6e65;line-height:1.65;margin:10px 0 0}
.view-options{display:grid;gap:10px;margin-top:12px}.view-option{display:flex;align-items:center;justify-content:space-between;gap:16px;padding:11px 12px;background:#f7f1ea;border:1px solid #e2d4c7;border-radius:9px}.view-option span{font-size:14px}.view-option input{width:20px;height:20px;accent-color:var(--blue)}.view-option.disabled{opacity:.45}.view-help{font-size:11px;color:#7d6e65;line-height:1.55;margin:9px 0 0}
@media(max-width:620px){.app{padding:9px 10px 28px}.brand h1{font-size:21px}.desc{display:none}.add{padding:10px 12px}.card{align-items:flex-start;flex-wrap:wrap}.title{flex-basis:100%}.actions{width:100%;justify-content:flex-start}.actions button{padding:8px 9px}}
</style>
</head>
<body>
<div class="app">
<header>
  <div class="brand"><h1>文化譜面帳</h1><div class="subline"><span class="en">SHIAN SCORE BOOK</span><span class="desc">文化譜を「見る・演奏する・編集する」ための譜面帳</span></div></div>
  <button class="add" id="addBtn">＋ 文化譜を追加</button>
</header>
<section class="tools">
  <div class="kana" id="kana">
<button type="button" class="active" data-row="すべて">すべて</button>
<button type="button" data-row="あ">あ</button>
<button type="button" data-row="か">か</button>
<button type="button" data-row="さ">さ</button>
<button type="button" data-row="た">た</button>
<button type="button" data-row="な">な</button>
<button type="button" data-row="は">は</button>
<button type="button" data-row="ま">ま</button>
<button type="button" data-row="や">や</button>
<button type="button" data-row="ら">ら</button>
<button type="button" data-row="わ">わ</button>
</div>
  <input class="search" id="search" type="search" placeholder="曲名を検索">
</section>
<main class="list" id="list"></main>
<div style="text-align:right;font:10px Arial,sans-serif;color:#b7a89b;margin-top:12px">v1.4</div>
<div class="popup-overlay" id="viewDialog" aria-hidden="true"><div class="popup-center"><div class="popup-card" role="dialog" aria-modal="true"><h2>譜面に表示するもの</h2><div class="song-name" id="viewSongTitle"></div><div class="view-options" id="viewOptions"></div><p class="view-help">チェックを外した項目は、この閲覧時だけ非表示になります。保存済みの文化譜データは変更しません。</p><div class="modal-actions"><button type="button" id="viewCancel">キャンセル</button><button type="button" class="primary" id="viewGo">GO：譜面を見る</button></div></div></div></div>
<input id="file" type="file" accept=".json,application/json" hidden>
</div>

<div class="popup-overlay" id="readingDialog" aria-hidden="true">
<div class="popup-center"><div class="popup-card" role="dialog" aria-modal="true" aria-labelledby="readingTitle">
<h2 id="readingTitle">曲名のよみを入力</h2>
<div class="field"><label>曲名</label><div class="song-name" id="modalTitle"></div></div>
<div class="field"><label for="modalReading">よみ（ひらがな）</label><input id="modalReading" autocomplete="off" placeholder="例：こんぴらふねふね"></div>
<p class="note">50音順に正しく並べるため、この曲の「よみ」だけ入力してください。最初の登録時だけ必要です。</p>
<div class="modal-actions"><button type="button" id="readingCancel">キャンセル</button><button type="button" class="primary" id="registerBtn">登録</button></div>
</div></div></div>

<div class="popup-overlay" id="duplicateDialog" aria-hidden="true">
<div class="popup-center"><div class="popup-card" role="dialog" aria-modal="true" aria-labelledby="duplicateTitle">
<h2 id="duplicateTitle">すでに登録されています</h2><p id="duplicateText"></p>
<p class="note">更新すると、譜面帳に登録されている同名の文化譜データを今回選んだJSONで置き換えます。</p>
<div class="modal-actions"><button type="button" id="duplicateCancel">キャンセル</button><button type="button" class="primary" id="duplicateUpdate">更新</button></div>
</div></div></div>

<script>
(()=>{
const KEY="shian-scorebook-library-v2";
const ROWS=["すべて","あ","か","さ","た","な","は","ま","や","ら","わ"];
let active="すべて", pending=null, duplicateIndex=-1, pendingView=null;
const $=s=>document.querySelector(s), list=$("#list"), file=$("#file"), collator=new Intl.Collator("ja",{sensitivity:"base",numeric:true});

function load(){try{const x=JSON.parse(localStorage.getItem(KEY)||"[]");return Array.isArray(x)?x:[]}catch{return []}}
function save(x){localStorage.setItem(KEY,JSON.stringify(x))}
function hira(s=""){return s.normalize("NFKC").replace(/[ァ-ヶ]/g,c=>String.fromCharCode(c.charCodeAt(0)-0x60)).replace(/\s+/g,"").toLowerCase()}
function baseKana(s=""){return hira(s).normalize("NFD").replace(/[\u3099\u309A]/g,"").normalize("NFC").replace(/[ぁぃぅぇぉ]/g,c=>({"ぁ":"あ","ぃ":"い","ぅ":"う","ぇ":"え","ぉ":"お"}[c])).replace(/[ゃゅょ]/g,c=>({"ゃ":"や","ゅ":"ゆ","ょ":"よ"}[c])).replace("っ","つ")}
function rowOf(reading){
 const c=baseKana(reading)[0]||"";
 const map={あ:"あ",い:"あ",う:"あ",え:"あ",お:"あ",か:"か",き:"か",く:"か",け:"か",こ:"か",さ:"さ",し:"さ",す:"さ",せ:"さ",そ:"さ",た:"た",ち:"た",つ:"た",て:"た",と:"た",な:"な",に:"な",ぬ:"な",ね:"な",の:"な",は:"は",ひ:"は",ふ:"は",へ:"は",ほ:"は",ま:"ま",み:"ま",む:"ま",め:"ま",も:"ま",や:"や",ゆ:"や",よ:"や",ら:"ら",り:"ら",る:"ら",れ:"ら",ろ:"ら",わ:"わ",を:"わ",ん:"わ"};
 return map[c]||"";
}
function kanaOnly(title){return /^[\u3040-\u309f\u30a0-\u30ffー・ 　]+$/.test(title)}
function scoreFrom(data){return data&&data.score&&typeof data.score==="object"?data.score:data}
function titleFrom(data){
 const s=scoreFrom(data)||{};
 return String(s.title||data.title||data.name||data.scoreTitle||"").trim();
}
function readingFrom(data,title){
 const s=scoreFrom(data)||{};
 return String(s.reading||s.yomigana||s.kana||data.reading||data.yomigana||data.kana||(kanaOnly(title)?title:"")).trim();
}
function valid(data){
 if(!data||typeof data!=="object")return false;
 if(data.format==="shian-bunkafu"&&data.score&&typeof data.score==="object")return true;
 const s=scoreFrom(data);
 return !!(s&&typeof s==="object"&&(
   "title" in s||Array.isArray(s.notes)||Array.isArray(s.vocalNotes)||
   Array.isArray(s.scoreParts)||Array.isArray(s.rowMeasureCounts)||
   typeof s.rows==="number"||typeof s.measuresPerRow==="number"
 ));
}
function makeItem(data,title,reading,old={}){
 return {...old,id:old.id||crypto.randomUUID(),title,reading:hira(reading),payload:data,updatedAt:new Date().toISOString(),createdAt:old.createdAt||new Date().toISOString()};
}
function openPopup(el){el.classList.add("open");el.setAttribute("aria-hidden","false")}
function closePopup(el){el.classList.remove("open");el.setAttribute("aria-hidden","true")}
function finishAdd(data,title,reading){
 let lib=load(); duplicateIndex=lib.findIndex(x=>x.title===title);
 pending={data,title,reading};
 if(duplicateIndex>=0){$("#duplicateText").textContent="「"+title+"」は譜面帳に登録済みです。更新しますか？";openPopup($("#duplicateDialog"));return}
 lib.push(makeItem(data,title,reading));save(lib);pending=null;render();
}
function scoreOfPayload(payload){return payload&&payload.score&&typeof payload.score==="object"?payload.score:payload}
function hasLyrics(score){return Array.isArray(score?.lyrics)&&score.lyrics.some(x=>String(x||"").trim())}
function hasVocal(score){return Array.isArray(score?.vocalNotes)&&score.vocalNotes.length>0}
function layerLabel(layer,index){if(layer?.name)return String(layer.name);if(layer?.label)return String(layer.label);if(layer?.id==="technique-layer")return "奏法";return "書き込み"+(index+1)}
function openViewOptions(item){
 const score=scoreOfPayload(item.payload)||{},box=$("#viewOptions");pendingView=item;$("#viewSongTitle").textContent=item.title;box.innerHTML="";
 const add=(key,label,checked,enabled=true)=>{const row=document.createElement("label");row.className="view-option"+(enabled?"":" disabled");const name=document.createElement("span");name.textContent=label;const input=document.createElement("input");input.type="checkbox";input.dataset.viewKey=key;input.checked=checked;input.disabled=!enabled;row.append(name,input);box.append(row)};
 add("lyrics","歌詞",score.lyricsVisible!==false,hasLyrics(score));add("vocal","唄",score.vocalVisible!==false,hasVocal(score));
 (Array.isArray(score.layers)?score.layers:[]).forEach((layer,i)=>{const tech=layer?.id==="technique-layer",items=Array.isArray(layer?.items)&&layer.items.length>0;add("layer:"+i,layerLabel(layer,i),layer?.visible!==false,tech||items)});
 openPopup($("#viewDialog"));
}
function render(){
 let lib=load().sort((a,b)=>collator.compare(hira(a.reading||a.title),hira(b.reading||b.title)));
 const q=hira($("#search").value);
 lib=lib.filter(x=>(active==="すべて"||rowOf(x.reading||x.title)===active)&&(!q||hira(x.title).includes(q)||hira(x.reading).includes(q)));
 list.innerHTML="";
 if(!lib.length){list.innerHTML='<div class="empty">登録されている文化譜はありません。</div>';return}
 for(const x of lib){
  const card=document.createElement("article");card.className="card";
  const t=document.createElement("div");t.className="title";t.textContent=x.title;
  const a=document.createElement("div");a.className="actions";
  const view=document.createElement("button");view.className="view";view.textContent="譜面を見る";view.title="表示する項目を選んで譜面を見る";view.onclick=()=>openViewOptions(x);
  const play=document.createElement("button");play.textContent="▶ 自動演奏";play.title="絲庵譜プレーヤーで開く";
  play.onclick=()=>{
    try{
      sessionStorage.setItem("shian-scorebook-player-score",JSON.stringify(x.payload));
      location.href="./player.html?from=scorebook";
    }catch(error){
      alert("自動演奏へ文化譜を渡せませんでした。\n"+(error?.message||error));
    }
  };
  const del=document.createElement("button");del.className="delete";del.textContent="譜面帳から削除";
  del.onclick=()=>{if(confirm("「"+x.title+"」を譜面帳から削除しますか？\\n元のJSONファイルは削除されません。")){save(load().filter(y=>y.id!==x.id));render()}};
  a.append(view,play,del);card.append(t,a);list.append(card);
 }
}
const kana=$("#kana");
kana.querySelectorAll("button[data-row]").forEach(b=>{
 b.addEventListener("click",()=>{
   active=b.dataset.row;
   kana.querySelectorAll("button[data-row]").forEach(x=>x.classList.toggle("active",x===b));
   render();
 });
});
$("#search").addEventListener("input",render);
$("#addBtn").onclick=()=>{file.value="";file.click()};
file.onchange=async()=>{
 const f=file.files[0];if(!f)return;
 try{
  const data=JSON.parse(await f.text());
  if(!valid(data))throw new Error("文化譜JSONとして認識できません。文化譜作成アプリで保存したJSONを選んでください。");
  const title=titleFrom(data);if(!title)throw new Error("曲名が見つかりません。");
  const reading=readingFrom(data,title);
  if(reading){finishAdd(data,title,reading)}
  else{pending={data,title};$("#modalTitle").textContent=title;$("#modalReading").value="";openPopup($("#readingDialog"));setTimeout(()=>$("#modalReading").focus(),50)}
 }catch(e){alert("文化譜を追加できませんでした。\\n"+e.message)}
};
$("#readingCancel").onclick=()=>{closePopup($("#readingDialog"));pending=null};
$("#registerBtn").onclick=()=>{
 if(!pending)return;
 const r=$("#modalReading").value.trim();
 if(!r){$("#modalReading").focus();return}
 const p=pending;pending=null;closePopup($("#readingDialog"));finishAdd(p.data,p.title,r);
};
$("#duplicateCancel").onclick=()=>{closePopup($("#duplicateDialog"));pending=null;duplicateIndex=-1};
$("#duplicateUpdate").onclick=()=>{
 if(pending&&duplicateIndex>=0){
  const lib=load(),old=lib[duplicateIndex];
  lib[duplicateIndex]=makeItem(pending.data,pending.title,pending.reading||old.reading,old);save(lib);render();
 }
 closePopup($("#duplicateDialog"));pending=null;duplicateIndex=-1;
};
$("#modalReading").addEventListener("keydown",e=>{if(e.key==="Enter")$("#registerBtn").click()});
$("#viewCancel").onclick=()=>{closePopup($("#viewDialog"));pendingView=null};
$("#viewGo").onclick=()=>{
 if(!pendingView)return;
 try{
  const cloned=JSON.parse(JSON.stringify(pendingView.payload)),score=scoreOfPayload(cloned);
  $("#viewOptions").querySelectorAll("input[data-view-key]").forEach(input=>{if(input.disabled)return;const key=input.dataset.viewKey;if(key==="lyrics")score.lyricsVisible=input.checked;else if(key==="vocal")score.vocalVisible=input.checked;else if(key.startsWith("layer:")){const i=Number(key.slice(6));if(Array.isArray(score.layers)&&score.layers[i]){score.layers[i].visible=input.checked;score.layers[i].printEnabled=input.checked}}});
  sessionStorage.setItem("shian-scorebook-view-score",JSON.stringify(cloned));closePopup($("#viewDialog"));pendingView=null;location.href="./viewer.html";
 }catch(error){alert("譜面を開く準備ができませんでした。\\n"+(error?.message||error))}
};
render();
})();
</script>
</body></html>
