<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>文化譜面帳｜絲庵</title><style>
:root{--ink:#332c26;--sub:#766a60;--paper:#fffef9;--bg:#f3eee7;--line:#d8cbbd;--accent:#477d91;--accent2:#315f70;--soft:#e9f1f3}*{box-sizing:border-box}body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Yu Gothic",sans-serif;color:var(--ink);background:var(--bg)}header{height:72px;background:#fffaf3;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;padding:0 32px}.brand{font-family:"Yu Mincho",serif;font-size:25px;font-weight:700}.brand small{display:block;font:11px sans-serif;letter-spacing:.2em;color:var(--sub);margin-top:2px}.add{border:0;border-radius:10px;background:var(--accent);color:#fff;font-weight:700;padding:12px 18px;font-size:14px}.wrap{max-width:1120px;margin:30px auto;padding:0 24px}.top{display:flex;align-items:end;justify-content:space-between;gap:20px;margin-bottom:22px}.top h1{font:700 29px "Yu Mincho",serif;margin:0 0 7px}.top p{margin:0;color:var(--sub);font-size:13px}.search{width:340px;background:#fff;border:1px solid var(--line);border-radius:12px;padding:12px 14px;font-size:14px}.tabs{display:flex;gap:8px;margin-bottom:18px}.tab{border:1px solid var(--line);background:#fff;border-radius:999px;padding:8px 14px;font-size:13px}.tab.on{background:var(--ink);color:#fff;border-color:var(--ink)}.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:16px}.card{background:#fff;border:1px solid var(--line);border-radius:16px;padding:20px;box-shadow:0 2px 10px #493a2c0c}.meta{display:flex;justify-content:space-between;align-items:start}.title{font:700 21px "Yu Mincho",serif;margin:0 0 7px}.detail{font-size:12px;color:var(--sub)}.recent{font-size:11px;background:#f2ede6;padding:5px 8px;border-radius:999px;color:var(--sub)}.actions{display:grid;grid-template-columns:1.25fr 1fr 1fr;gap:8px;margin-top:18px}.actions button{border:1px solid var(--line);background:#fff;border-radius:9px;padding:10px 6px;font-weight:700;color:var(--ink)}.actions .view{background:var(--soft);border-color:#abc2ca;color:var(--accent2)}.foot{margin-top:22px;color:var(--sub);font-size:12px;text-align:center}.modal{position:fixed;inset:0;background:#2b2825d9;display:none;align-items:center;justify-content:center;padding:18px;z-index:10}.modal.on{display:flex}.viewer{width:min(1040px,96vw);height:94vh;display:grid;grid-template-columns:70px 1fr 70px;align-items:center}.arrow{height:120px;border:0;background:transparent;color:#fff;font-size:54px;cursor:pointer}.paperWrap{height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center}.paper{position:relative;background:var(--paper);width:min(650px,calc(94vh * .707));aspect-ratio:210/297;box-shadow:0 8px 30px #0008;padding:34px 42px}.close{position:absolute;right:20px;top:16px;color:#fff;border:1px solid #ffffff66;background:#0003;border-radius:50%;width:38px;height:38px;font-size:22px}.phead{display:grid;grid-template-columns:1fr 2fr 1fr;align-items:end;font-family:"Yu Mincho",serif;font-size:11px}.song{text-align:center;font-size:21px;border-bottom:1px solid #333;padding:0 12px 4px}.summary{text-align:right}.staff{margin-top:30px;display:grid;grid-template-columns:35px 1fr}.labels{font-size:9px;line-height:18px;text-align:right;padding-right:6px}.score{display:grid;grid-template-columns:repeat(4,1fr);height:54px}.measure{position:relative;border-left:1px solid #333}.measure:last-child{border-right:1px solid #333}.line{height:18px;border-top:1px solid #333;position:relative}.line:last-child{border-bottom:1px solid #333}.note{position:absolute;top:-9px;background:var(--paper);font:700 13px Arial;padding:0 2px}.n1{left:22%}.n2{left:62%}.pageNo{color:#fff;margin-top:9px;font-weight:700;font-size:13px}.hint{color:#eee;font-size:11px;margin-top:5px}@media(max-width:760px){header{padding:0 16px}.wrap{padding:0 14px}.top{align-items:stretch;flex-direction:column}.search{width:100%}.grid{grid-template-columns:1fr}.actions{grid-template-columns:1fr 1fr}.actions .view{grid-column:1/-1}.viewer{grid-template-columns:42px 1fr 42px}.paper{width:min(650px,calc(88vw - 84px));padding:24px 22px}.song{font-size:16px}}
</style></head><body><header><div class="brand">文化譜面帳<small>SHIAN SCORE BOOK</small></div><button class="add" onclick="document.getElementById('file').click()">＋ 譜面を追加</button><input id="file" type="file" accept=".json,application/json" hidden></header><main class="wrap"><div class="top"><div><h1>わたしの文化譜</h1><p>文化譜を「見る・演奏する・編集する」ための譜面帳</p></div><input class="search" placeholder="曲名を検索"></div><div class="tabs"><button class="tab on">すべて</button><button class="tab">本調子</button><button class="tab">二上り</button><button class="tab">三下り</button></div><section class="grid"><article class="card"><div class="meta"><div><h2 class="title">津軽じょんから節</h2><div class="detail">二上り　・　2/4拍子　・　3ページ</div></div><span class="recent">最近開いた曲</span></div><div class="actions"><button class="view" onclick="openViewer()">譜面を見る</button><button>▶ 自動演奏</button><button onclick="location.href='./index.html'">✎ 編集する</button></div></article><article class="card"><div class="meta"><div><h2 class="title">黒石よされ</h2><div class="detail">本調子　・　2/4拍子　・　1ページ</div></div></div><div class="actions"><button class="view" onclick="openViewer()">譜面を見る</button><button>▶ 自動演奏</button><button onclick="location.href='./index.html'">✎ 編集する</button></div></article><article class="card"><div class="meta"><div><h2 class="title">りんご節</h2><div class="detail">二上り　・　2/4拍子　・　2ページ</div></div></div><div class="actions"><button class="view" onclick="openViewer()">譜面を見る</button><button>▶ 自動演奏</button><button onclick="location.href='./index.html'">✎ 編集する</button></div></article></section><div class="foot">※ この画面は文化譜面帳の操作・レイアウト確認用試作です。</div></main><div class="modal" id="modal"><button class="close" onclick="closeViewer()">×</button><div class="viewer"><button class="arrow" onclick="prev()">‹</button><div class="paperWrap"><div class="paper"><div class="phead"><span>二上り</span><span class="song">津軽じょんから節</span><span class="summary">2/4拍子</span></div><div id="staffs"></div></div><div class="pageNo"><span id="pn">1</span> / 3</div><div class="hint">左右端をタップしてページ移動</div></div><button class="arrow" onclick="next()">›</button></div></div><script>
let page=1;function rows(){let out='';for(let r=0;r<8;r++){out+=`<div class="staff"><div class="labels">三の糸<br>二の糸<br>一の糸</div><div class="score">`;for(let m=0;m<4;m++)out+=`<div class="measure"><div class="line"><b class="note n1">${(r+m+page)%9+1}</b></div><div class="line"><b class="note n2">${(r+m+3)%12+1}</b></div><div class="line"></div></div>`;out+='</div></div>'}document.getElementById('staffs').innerHTML=out}function openViewer(){page=1;document.getElementById('modal').classList.add('on');update()}function closeViewer(){document.getElementById('modal').classList.remove('on')}function update(){document.getElementById('pn').textContent=page;rows()}function next(){if(page<3){page++;update()}}function prev(){if(page>1){page--;update()}}document.addEventListener('keydown',e=>{if(!document.getElementById('modal').classList.contains('on'))return;if(e.key==='ArrowRight')next();if(e.key==='ArrowLeft')prev();if(e.key==='Escape')closeViewer()});rows();
</script></body></html>
