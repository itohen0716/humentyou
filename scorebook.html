<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>文化譜面帳｜絲庵</title><style>
:root{--ink:#332c26;--sub:#766a60;--paper:#fffef9;--bg:#f3eee7;--line:#d8cbbd;--accent:#477d91;--accent2:#315f70;--soft:#e9f1f3}*{box-sizing:border-box}body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Yu Gothic",sans-serif;color:var(--ink);background:var(--bg)}header{min-height:72px;background:#fffaf3;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;padding:10px 32px;gap:12px}.brand{font-family:"Yu Mincho",serif;font-size:25px;font-weight:700}.brand small{display:block;font:11px sans-serif;letter-spacing:.2em;color:var(--sub);margin-top:2px}.add{border:0;border-radius:10px;background:var(--accent);color:#fff;font-weight:700;padding:12px 18px;font-size:14px;cursor:pointer}.wrap{max-width:1120px;margin:30px auto;padding:0 24px}.top{display:flex;align-items:end;justify-content:space-between;gap:20px;margin-bottom:22px}.top h1{font:700 29px "Yu Mincho",serif;margin:0 0 7px}.top p{margin:0;color:var(--sub);font-size:13px}.search{width:340px;background:#fff;border:1px solid var(--line);border-radius:12px;padding:12px 14px;font-size:14px}.tabs{display:flex;gap:8px;margin-bottom:18px;flex-wrap:wrap}.tab{border:1px solid var(--line);background:#fff;border-radius:999px;padding:8px 14px;font-size:13px;cursor:pointer}.tab.on{background:var(--ink);color:#fff;border-color:var(--ink)}.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:16px}.card{background:#fff;border:1px solid var(--line);border-radius:16px;padding:20px;box-shadow:0 2px 10px #493a2c0c}.meta{display:flex;justify-content:space-between;align-items:start;gap:10px}.title{font:700 21px "Yu Mincho",serif;margin:0 0 7px}.detail{font-size:12px;color:var(--sub)}.actions{display:grid;grid-template-columns:1.25fr 1fr 1fr;gap:8px;margin-top:18px}.actions button{border:1px solid var(--line);background:#fff;border-radius:9px;padding:10px 6px;font-weight:700;color:var(--ink);cursor:pointer}.actions .view{background:var(--soft);border-color:#abc2ca;color:var(--accent2)}.remove{margin-top:10px;border:0;background:transparent;color:#8b7768;font-size:11px;cursor:pointer}.empty{grid-column:1/-1;background:#fff;border:1px dashed var(--line);border-radius:16px;padding:54px 20px;text-align:center;color:var(--sub)}.empty strong{display:block;color:var(--ink);font-size:18px;margin-bottom:8px}.foot{margin-top:22px;color:var(--sub);font-size:12px;text-align:center}.modal{position:fixed;inset:0;background:#2b2825e8;display:none;z-index:10}.modal.on{display:block}.close{position:fixed;right:18px;top:14px;z-index:20;color:#fff;border:1px solid #ffffff66;background:#0005;border-radius:50%;width:42px;height:42px;font-size:24px;cursor:pointer}.viewer{height:100vh;display:grid;grid-template-columns:minmax(48px,1fr) minmax(280px,780px) minmax(48px,1fr);align-items:center}.edge{height:100%;border:0;background:transparent;color:#fff;font-size:56px;cursor:pointer}.edge:disabled{opacity:.15}.paperWrap{height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;overflow:hidden}.paper{background:var(--paper);width:min(700px,calc(91vh * .707));aspect-ratio:210/297;box-shadow:0 8px 30px #0008;padding:5.3% 6%;overflow:hidden}.phead{position:relative;height:7%;font-family:"Yu Mincho",serif;font-size:12px}.song{position:absolute;left:50%;transform:translateX(-50%);font-size:21px;border-bottom:1px solid #333;padding:0 12px 4px;white-space:nowrap}.tm{position:absolute;left:0;bottom:4px}.staffs{height:90%;padding-top:3%}.staff{display:grid;grid-template-columns:42px 1fr}.labels{font:10px/18px serif;text-align:right;padding-right:7px}.score{display:flex;height:54px}.measure{position:relative;flex:1;border-left:1px solid #333}.measure:last-child{border-right:1px solid #333}.string{position:relative;height:18px}.string:before{content:"";position:absolute;left:0;right:0;top:9px;border-top:1px solid #333}.note{position:absolute;top:1px;transform:translateX(-50%);font:600 13px/14px Arial;background:#fffef9;padding:0 1px}.note.open{font-size:24px;font-weight:400}.note.d2:after,.note.d1:after{content:"";position:absolute;left:50%;top:15px;width:13px;transform:translateX(-50%);border-top:1px solid currentColor}.note.d1:before{content:"";position:absolute;left:50%;top:18px;width:13px;transform:translateX(-50%);border-top:1px solid currentColor}.pageNo{color:#fff;margin-top:8px;font-weight:700}.hint{color:#eee;font-size:11px;margin-top:4px}@media(max-width:760px){header{padding:10px 14px}.brand{font-size:21px}.add{padding:10px 12px}.wrap{padding:0 14px}.top{align-items:stretch;flex-direction:column}.search{width:100%}.grid{grid-template-columns:1fr}.actions{grid-template-columns:1fr 1fr}.actions .view{grid-column:1/-1}.viewer{grid-template-columns:42px 1fr 42px}.paper{width:calc(100vw - 92px);padding:5%}.song{font-size:15px}.tm{font-size:9px}.labels{font-size:7px;line-height:12px}.score{height:36px}.string{height:12px}.string:before{top:6px}.note{font-size:10px;line-height:10px}.staff{grid-template-columns:30px 1fr}}
</style></head><body><header><div class="brand">文化譜面帳<small>SHIAN SCORE BOOK</small></div><button class="add" id="addBtn">＋ 文化譜を追加</button><input id="file" type="file" accept=".json,application/json" multiple hidden></header><main class="wrap"><div class="top"><div><h1>わたしの文化譜</h1><p>文化譜を「見る・演奏する・編集する」ための譜面帳</p></div><input id="search" class="search" placeholder="曲名を検索"></div><div class="tabs" id="tabs"><button class="tab on" data-tuning="すべて">すべて</button><button class="tab" data-tuning="本調子">本調子</button><button class="tab" data-tuning="二上り">二上り</button><button class="tab" data-tuning="三下り">三下り</button></div><section class="grid" id="grid"></section><div class="foot">文化譜JSONはこのブラウザの譜面帳に登録します。元のJSONファイルは変更しません。</div></main><div class="modal" id="modal"><button class="close" id="closeBtn">×</button><div class="viewer"><button class="edge" id="prevBtn">‹</button><div class="paperWrap"><div class="paper"><div class="phead"><span class="tm" id="viewerMeta"></span><span class="song" id="viewerTitle"></span></div><div class="staffs" id="staffs"></div></div><div class="pageNo"><span id="pn">1</span> / <span id="pc">1</span></div><div class="hint">左右端をタップ／スワイプしてページ移動</div></div><button class="edge" id="nextBtn">›</button></div></div><script>
(()=>{'use strict';const LIB='shian-scorebook-library-v1',EDIT='shian-scorebook-edit-score',PLAY='shian-live-player-score';let library=loadLibrary(),filter='すべて',viewer=null,page=0,touchX=null;const $=s=>document.querySelector(s);function loadLibrary(){try{const x=JSON.parse(localStorage.getItem(LIB)||'[]');return Array.isArray(x)?x:[]}catch{return[]}}function saveLibrary(){localStorage.setItem(LIB,JSON.stringify(library))}function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}function scoreOf(p){return p?.format==='shian-bunkafu'?p.score:p}function validPayload(p){const s=scoreOf(p);return !!(s&&Array.isArray(s.notes)&&Number.isInteger(Number(s.rows))&&Number(s.rows)>0)}function pageRows(s){if(s.printMode==='manual'){const a=String(s.manualPageRows||'').replace(/[、，]/g,',').split(',').map(Number),max=s.lyricsMode?7:10;if(a.length&&a.every(n=>Number.isInteger(n)&&n>0&&n<=max)&&a.reduce((x,y)=>x+y,0)===Number(s.rows))return a}const max=s.lyricsMode?7:10,n=Number(s.rows)||1,p=Math.max(1,Math.ceil(n/max)),base=Math.floor(n/p),extra=n%p;return Array.from({length:p},(_,i)=>base+(i<extra?1:0))}function idFor(p,name){const s=scoreOf(p);return [s.title||name,s.tuning||'',s.meter||'',s.rows||'',(s.notes||[]).length,Date.now(),Math.random()].join('|')}function render(){const q=$('#search').value.trim().toLowerCase(),items=library.filter(x=>{const s=scoreOf(x.payload);return(filter==='すべて'||s.tuning===filter)&&String(s.title||x.name).toLowerCase().includes(q)});$('#grid').innerHTML=items.length?items.map(x=>{const s=scoreOf(x.payload),pages=pageRows(s).length;return `<article class="card"><div class="meta"><div><h2 class="title">${esc(s.title||x.name||'曲名未設定')}</h2><div class="detail">${esc(s.tuning||'')}　・　${esc(s.meter||'')}拍子　・　${pages}ページ</div></div></div><div class="actions"><button class="view" data-act="view" data-id="${esc(x.id)}">譜面を見る</button><button data-act="play" data-id="${esc(x.id)}">▶ 自動演奏</button><button data-act="edit" data-id="${esc(x.id)}">✎ 編集する</button></div><button class="remove" data-act="remove" data-id="${esc(x.id)}">譜面帳から削除</button></article>`}).join(''):`<div class="empty"><strong>文化譜がまだありません</strong>「＋ 文化譜を追加」から、保存済みの文化譜JSONを選んでください。</div>`}async function addFiles(files){for(const f of files){try{const p=JSON.parse(await f.text());if(!validPayload(p)){alert(`${f.name} は文化譜JSONとして読み込めませんでした。`);continue}const s=scoreOf(p),same=library.findIndex(x=>(scoreOf(x.payload).title||x.name)===(s.title||f.name));const item={id:idFor(p,f.name),name:f.name,addedAt:Date.now(),payload:p};if(same>=0){if(confirm(`「${s.title||f.name}」は登録済みです。新しい内容に入れ替えますか？`))library.splice(same,1,item)}else library.push(item)}catch(e){console.error(e);alert(`${f.name} を読み込めませんでした。`)}}saveLibrary();render()}function find(id){return library.find(x=>x.id===id)}function edit(x){sessionStorage.setItem(EDIT,JSON.stringify(x.payload));location.href='./index.html'}function play(x){const s=scoreOf(x.payload);if(!s.notes?.length){alert('演奏できる音がまだ入力されていません。');return}const payload={format:'shian-live-score',version:3,sentAt:Date.now(),score:{title:String(s.title||''),tuning:String(s.tuning||'二上り'),meter:String(s.meter||'2/4'),notes:s.notes.map(n=>({m:Number(n.m)||0,s:Number(n.s)||1,p:Number(n.p)||0,d:[1,2,4].includes(Number(n.d))?Number(n.d):4,v:String(n.v||''),rest:Boolean(n.rest)})),vocalNotes:(s.vocalNotes||[]).map(n=>({id:String(n.id||''),m:Number(n.m)||0,s:Number(n.s)||3,p:Number(n.p)||0,d:[1,2,4].includes(Number(n.d))?Number(n.d):4,v:String(n.v||''),kind:String(n.kind||'pitch')})),vocalSlurs:(s.vocalSlurs||[]).map(v=>({startId:String(v.startId||''),endId:String(v.endId||'')}))}};sessionStorage.setItem(PLAY,JSON.stringify(payload));location.href='./player/index.html'}function openView(x){viewer=x;page=0;$('#modal').classList.add('on');drawPage()}function closeView(){$('#modal').classList.remove('on');viewer=null}function rowStarts(s){const a=s.rowMeasureCounts?.length?s.rowMeasureCounts:Array(Number(s.rows)||1).fill(Number(s.measuresPerRow)||4),out=[];let n=0;for(const c of a){out.push(n);n+=Number(c)||4}return{counts:a,starts:out}}function drawPage(){if(!viewer)return;const s=scoreOf(viewer.payload),prs=pageRows(s),start=prs.slice(0,page).reduce((a,b)=>a+b,0),count=prs[page],{counts,starts}=rowStarts(s),capacity=(()=>{const m=String(s.meter||'2/4').match(/(\d+)\/(\d+)/);return m?16*Number(m[1])/Number(m[2]):8})();$('#viewerTitle').textContent=s.title||viewer.name;$('#viewerMeta').textContent=`〈${s.tuning||''}〉　${s.meter||''}拍子`;let html='';for(let r=start;r<start+count;r++){const mc=Number(counts[r])||4;html+=`<div class="staff"><div class="labels">${r===0?'三の糸<br>二の糸<br>一の糸':'<br><br>'}</div><div class="score">`;for(let local=0;local<mc;local++){const m=starts[r]+local;html+='<div class="measure">';for(const str of [3,2,1]){html+='<div class="string">';for(const n of (s.notes||[]).filter(n=>Number(n.m)===m&&Number(n.s)===str)){const left=Math.max(.5,Math.min(99.5,(Number(n.p)+.5)/capacity*100));const val=n.rest?'●':String(n.v||'');html+=`<span class="note d${[1,2,4].includes(Number(n.d))?Number(n.d):4}${n.v==='○'?' open':''}" style="left:${left}%;color:${esc(n.color||'#222')}">${esc(val)}</span>`}html+='</div>'}html+='</div>'}html+='</div></div>'}$('#staffs').innerHTML=html;$('#pn').textContent=page+1;$('#pc').textContent=prs.length;$('#prevBtn').disabled=page===0;$('#nextBtn').disabled=page===prs.length-1}function prev(){if(viewer&&page>0){page--;drawPage()}}function next(){if(viewer&&page<pageRows(scoreOf(viewer.payload)).length-1){page++;drawPage()}}$('#addBtn').onclick=()=>$('#file').click();$('#file').onchange=e=>{addFiles([...e.target.files]);e.target.value=''};$('#search').oninput=render;$('#tabs').onclick=e=>{const b=e.target.closest('.tab');if(!b)return;filter=b.dataset.tuning;document.querySelectorAll('.tab').forEach(x=>x.classList.toggle('on',x===b));render()};$('#grid').onclick=e=>{const b=e.target.closest('[data-act]');if(!b)return;const x=find(b.dataset.id);if(!x)return;if(b.dataset.act==='view')openView(x);if(b.dataset.act==='edit')edit(x);if(b.dataset.act==='play')play(x);if(b.dataset.act==='remove'&&confirm('この曲を譜面帳から削除しますか？\n元のJSONファイルは削除されません。')){library=library.filter(v=>v.id!==x.id);saveLibrary();render()}};$('#closeBtn').onclick=closeView;$('#prevBtn').onclick=prev;$('#nextBtn').onclick=next;document.addEventListener('keydown',e=>{if(!viewer)return;if(e.key==='ArrowLeft')prev();if(e.key==='ArrowRight')next();if(e.key==='Escape')closeView()});$('.paperWrap').addEventListener('touchstart',e=>touchX=e.changedTouches[0].clientX,{passive:true});$('.paperWrap').addEventListener('touchend',e=>{if(touchX===null)return;const d=e.changedTouches[0].clientX-touchX;if(Math.abs(d)>45)(d<0?next:prev)();touchX=null},{passive:true});render()})();
</script></body></html>
