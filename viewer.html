<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>文化譜を見る｜文化譜面帳</title>
<style>
*{box-sizing:border-box}
html,body{
  margin:0;
  min-height:100%;
  background:#e7dfd4;
  color:#332c25;
  font-family:"Yu Gothic",sans-serif
}
header{
  position:sticky;
  top:0;
  z-index:30;
  min-height:58px;
  display:grid;
  grid-template-columns:1fr auto 1fr;
  align-items:center;
  gap:12px;
  padding:8px 18px;
  background:#fffaf3;
  border-bottom:1px solid #d8cbbd
}
h1{margin:0;font:19px "Yu Mincho",serif}
.pager{display:flex;align-items:center;gap:10px}
button{
  border:1px solid #abc2ca;
  border-radius:9px;
  background:#f7fbfc;
  color:#315f70;
  font-weight:700;
  padding:8px 12px;
  cursor:pointer
}
button:disabled{opacity:.35;cursor:default}
#back{justify-self:end}
.viewer-actions{
  justify-self:end;
  display:grid;
  grid-template-columns:auto auto;
  gap:6px 8px;
  align-items:center
}
.viewer-note{
  grid-column:1 / 3;
  margin:0;
  color:#a9998e;
  font-size:10px;
  line-height:1.3;
  text-align:right;
  white-space:nowrap
}
#fullscreenBtn{
  border-color:#9fb9c3;
  background:#eef6f8;
  color:#285f75
}
body.fullscreen-view{
  background:#e7dfd4;
  overflow:hidden
}
body.fullscreen-view header{
  display:none!important
}
body.fullscreen-view main{
  padding:0!important;
  min-height:100vh;
  align-items:center
}
body.fullscreen-view #paperStage{
  box-shadow:none;
  touch-action:none!important;
  overscroll-behavior:none;
  -webkit-user-select:none;
  user-select:none
}
body.fullscreen-view #inkOverlay{
  touch-action:none!important;
  overscroll-behavior:none;
  -webkit-user-select:none;
  user-select:none
}
main{
  padding:18px 12px 40px;
  display:flex;
  justify-content:center;
  align-items:flex-start
}
#paperStage{
  position:relative;
  overflow:hidden;
  background:#fff;
  box-shadow:0 3px 16px rgba(0,0,0,.16);
  transition:opacity .12s ease, transform .12s ease
}
#paperStage.page-swipe-next{opacity:.88;transform:translateX(-10px)}
#paperStage.page-swipe-prev{opacity:.88;transform:translateX(10px)}
#sourceFrame{
  position:absolute;
  left:0;
  top:0;
  border:0;
  background:#fff;
  transform-origin:0 0
}
#inkOverlay{
  position:absolute;
  inset:0;
  z-index:8;
  width:100%;
  height:100%;
  pointer-events:auto;
  touch-action:manipulation;
  overflow:hidden;
  user-select:none;
  -webkit-user-select:none;
  -webkit-tap-highlight-color:transparent;
  background:rgba(64, 115, 220, .035)
}
#inkOverlay.is-drawing{
  touch-action:none;
  cursor:crosshair;
  background:rgba(64, 115, 220, .065)
}
.ink-popup{
  position:fixed;
  z-index:120;
  width:min(340px,calc(100vw - 24px));
  padding:14px;
  border:1px solid #cdbdad;
  border-radius:14px;
  background:#fffaf3;
  box-shadow:0 10px 28px rgba(56,39,29,.24);
  color:#332c25
}
.ink-popup[hidden]{display:none}
.ink-popup-head{
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:12px;
  margin-bottom:10px
}
.ink-popup-title{font:700 17px "Yu Mincho",serif}
.ink-close{
  width:36px;height:36px;padding:0;border-radius:50%;font-size:18px
}
.ink-section{margin-top:10px}
.ink-label{display:block;margin-bottom:6px;font-size:12px;color:#786c60;font-weight:700}
.ink-tools,.ink-widths,.ink-colors,.ink-actions{
  display:flex;
  flex-wrap:wrap;
  gap:7px
}
.ink-tools button,.ink-widths button,.ink-actions button{
  min-height:42px
}
.ink-tools button.on,.ink-widths button.on{
  background:#477d91;
  color:#fff;
  border-color:#477d91
}
.ink-color{
  width:34px;
  height:34px;
  padding:0;
  border:2px solid #fff;
  outline:1px solid #cdbdad;
  border-radius:50%;
  cursor:pointer
}
.ink-color.on{outline:3px solid #477d91}
#inkCustomColor{
  width:44px;
  height:36px;
  padding:2px;
  border:1px solid #cdbdad;
  border-radius:8px;
  background:#fff
}
.ink-actions{
  justify-content:flex-end;
  margin-top:12px;
  padding-top:10px;
  border-top:1px solid #e2d7cb
}
#inkStart{
  background:#477d91;
  color:#fff;
  border-color:#477d91
}
.ink-active-bar{
  position:fixed;
  z-index:110;
  right:14px;
  bottom:14px;
  display:flex;
  gap:7px;
  padding:7px;
  border:1px solid #cdbdad;
  border-radius:12px;
  background:rgba(255,250,243,.96);
  box-shadow:0 6px 18px rgba(56,39,29,.18)
}
.ink-active-bar[hidden]{display:none}
.ink-active-bar button{min-height:40px}
#inkState{
  position:fixed;
  z-index:109;
  left:14px;
  bottom:14px;
  max-width:min(420px,calc(100vw - 28px));
  padding:7px 10px;
  border-radius:9px;
  background:rgba(51,44,37,.82);
  color:#fff;
  font-size:11px;
  pointer-events:none
}
#inkState[hidden]{display:none}
#fullscreenHint{
  position:fixed;
  z-index:108;
  left:50%;
  bottom:10px;
  transform:translateX(-50%);
  padding:6px 11px;
  border-radius:999px;
  background:rgba(51,44,37,.58);
  color:#fff;
  font-size:10px;
  white-space:nowrap;
  pointer-events:none
}
#fullscreenHint[hidden]{display:none}
#loading{
  position:fixed;
  inset:58px 0 0;
  z-index:25;
  display:grid;
  place-items:center;
  background:#e7dfd4;
  color:#765f52
}
@media(max-width:700px){
  header{
    grid-template-columns:1fr auto;
    gap:7px;
    padding:7px 10px
  }
  .pager{
    grid-column:1/3;
    grid-row:2;
    justify-self:center
  }
  #loading{inset:96px 0 0}
  .viewer-actions{gap:5px;grid-column:2;grid-row:1}
  .viewer-note{display:none}
  #fullscreenBtn,#back{padding:7px 8px;font-size:11px}
  .ink-popup{left:12px!important;right:12px!important;top:auto!important;bottom:12px!important;width:auto}
  .ink-active-bar{right:8px;bottom:8px}
  #inkState{left:8px;bottom:62px}
}
</style>
</head>
<body>
<header>
  <h1>文化譜を見る</h1>
  <div class="pager" id="pager" hidden>
    <button id="prev">← 前のページ</button>
    <span id="count"></span>
    <button id="next">次のページ →</button>
  </div>
  <div class="viewer-actions">
    <button id="fullscreenBtn" type="button">⛶ 全画面表示</button>
    <button id="back" type="button">← 文化譜面帳へ戻る</button>
    <p class="viewer-note">全画面表示中は画面タップで戻ります。書き込みは戻ってからできます。</p>
  </div>
</header>

<main>
  <div id="paperStage">
    <iframe id="sourceFrame" title="文化譜 印刷ページ"></iframe>
    <svg id="inkOverlay" aria-label="手書きレイヤー">
      <g id="inkStrokes"></g>
      <path id="inkCurrent" fill="none" stroke-linecap="round" stroke-linejoin="round"></path>
    </svg>
  </div>
</main>

<div id="inkPopup" class="ink-popup" hidden role="dialog" aria-modal="false" aria-label="手書き設定">
  <div class="ink-popup-head">
    <div class="ink-popup-title">手書き設定</div>
    <button id="inkClose" class="ink-close" type="button" aria-label="閉じる">×</button>
  </div>

  <div class="ink-section">
    <span class="ink-label">道具</span>
    <div class="ink-tools">
      <button type="button" data-ink-tool="pen" class="on">✎ ペン</button>
      <button type="button" data-ink-tool="eraser">消しゴム</button>
    </div>
  </div>

  <div class="ink-section">
    <span class="ink-label">色</span>
    <div class="ink-colors">
      <button class="ink-color on" type="button" data-ink-color="#d92d20" style="background:#d92d20" aria-label="赤"></button>
      <button class="ink-color" type="button" data-ink-color="#111111" style="background:#111111" aria-label="黒"></button>
      <button class="ink-color" type="button" data-ink-color="#2463c5" style="background:#2463c5" aria-label="青"></button>
      <button class="ink-color" type="button" data-ink-color="#16824b" style="background:#16824b" aria-label="緑"></button>
      <button class="ink-color" type="button" data-ink-color="#e17b19" style="background:#e17b19" aria-label="橙"></button>
      <input id="inkCustomColor" type="color" value="#d92d20" aria-label="その他の色">
    </div>
  </div>

  <div class="ink-section">
    <span class="ink-label">線幅</span>
    <div class="ink-widths">
      <button type="button" data-ink-width="2">細</button>
      <button type="button" data-ink-width="4" class="on">中</button>
      <button type="button" data-ink-width="7">太</button>
    </div>
  </div>

  <div class="ink-actions">
    <button id="inkUndo" type="button">↶ 1本戻す</button>
    <button id="inkStart" type="button">書き込み開始</button>
  </div>
</div>

<div id="inkActiveBar" class="ink-active-bar" hidden>
  <button id="inkSettings" type="button">⚙ 設定</button>
  <button id="inkFinish" type="button">書き込み終了</button>
</div>
<div id="inkState" hidden></div>
<div id="fullscreenHint" hidden>← 次のページ　／　前のページ →　・タップで全画面終了</div>

<div id="loading">印刷用の文化譜を準備しています…</div>

<script>
(async()=>{
"use strict";

/*
  v3.0
  文化譜作成アプリの「正常な通常画面 → 正常な印刷DOM生成」を、そのまま再現する。
  閲覧側では歌詞・コメント・譜面部品の座標を一切再計算しない。
*/

const VIEW_KEY="shian-scorebook-view-score";
const VIEW_ITEM_KEY="shian-scorebook-view-item-id";
const EDIT_KEY="shian-bunkafu-editor-v2";
const INK_STORAGE_PREFIX="shian-scorebook-handwriting-v1:";
const APP_URL="https://itohen0716.github.io/sianhu/";

const PAGE_SIDE_MARGIN=24;
const PAGE_TOP_BOTTOM_MARGIN=18;
const MAX_VIEW_SCALE=1.12;

const raw=sessionStorage.getItem(VIEW_KEY);
const viewItemId=sessionStorage.getItem(VIEW_ITEM_KEY)||"";
const frame=document.getElementById("sourceFrame");
const stage=document.getElementById("paperStage");
const loading=document.getElementById("loading");
const inkOverlay=document.getElementById("inkOverlay");
const inkStrokes=document.getElementById("inkStrokes");
const inkCurrent=document.getElementById("inkCurrent");
const inkPopup=document.getElementById("inkPopup");
const inkActiveBar=document.getElementById("inkActiveBar");
const inkState=document.getElementById("inkState");
const fullscreenHint=document.getElementById("fullscreenHint");

document.getElementById("back").onclick=()=>location.replace("./index.html");

const fullscreenButton=document.getElementById("fullscreenBtn");

let softFullscreen=false;

function isFullscreenActive(){
  return Boolean(
    document.fullscreenElement ||
    document.webkitFullscreenElement ||
    softFullscreen
  );
}

async function enterFullscreen(){
  /* 全画面中は「閲覧専用」。誤記入防止のため手書きモードを終了する。 */
  if(typeof finishInkMode==="function")finishInkMode();

  const target=document.documentElement;

  try{
    if(target.requestFullscreen){
      await target.requestFullscreen();
      softFullscreen=false;
      return;
    }

    if(target.webkitRequestFullscreen){
      target.webkitRequestFullscreen();
      softFullscreen=false;
      return;
    }

    /* Fullscreen API が使えないタブレットでは画面内全画面へ切り替える */
    softFullscreen=true;
    syncFullscreenView();

  }catch(error){
    console.warn("ネイティブ全画面を開始できないため画面内全画面へ切り替えます。",error);
    softFullscreen=true;
    syncFullscreenView();
  }
}

async function exitFullscreenView(){
  try{
    if(document.exitFullscreen&&document.fullscreenElement){
      await document.exitFullscreen();
      return;
    }

    if(document.webkitExitFullscreen&&document.webkitFullscreenElement){
      document.webkitExitFullscreen();
      return;
    }
  }catch(error){
    console.warn(error);
  }

  if(softFullscreen){
    softFullscreen=false;
    syncFullscreenView();
  }
}

function syncFullscreenView(){
  const active=isFullscreenActive();
  document.body.classList.toggle("fullscreen-view",active);
  fullscreenButton.textContent=active?"全画面表示中":"⛶ 全画面表示";
  fullscreenHint.hidden=!active;
  fullscreenHint.textContent=pages.length>1
    ?"右から左へスワイプ：次へ　／　左から右へ：前へ　／　タップ：全画面終了"
    :"タップで全画面表示を終了";
  requestAnimationFrame(()=>showPage(currentPage));
}

fullscreenButton.addEventListener("click",enterFullscreen);
document.addEventListener("fullscreenchange",()=>{
  if(!document.fullscreenElement&&!document.webkitFullscreenElement&&softFullscreen===false){
    syncFullscreenView();
    return;
  }
  syncFullscreenView();
});
document.addEventListener("webkitfullscreenchange",syncFullscreenView);

if(!raw){
  loading.textContent="表示する文化譜が選択されていません。";
  return;
}

let payload,score;
try{
  payload=JSON.parse(raw);
  score=payload&&payload.score&&typeof payload.score==="object"?payload.score:payload;
  if(!score||typeof score!=="object")throw new Error("invalid score");
}catch(error){
  loading.textContent="文化譜データを読み込めませんでした。";
  return;
}


/* ===== 譜面帳専用・永続手書きレイヤー ===== */
const inkIdentity=viewItemId||("title:"+String(score.title||"untitled"));
const inkStorageKey=INK_STORAGE_PREFIX+inkIdentity;
let inkData={version:1,pages:{}};
let inkTool="pen";
let inkColor="#d92d20";
let inkWidth=4;
let inkActive=false;
let activeStroke=null;
let activePointerId=null;
let eraseChanged=false;
let currentFullWidth=1;
let currentFullHeight=1;
let lastTapTime=0;
let lastTapPoint=null;

try{
  const saved=JSON.parse(localStorage.getItem(inkStorageKey)||"null");
  if(saved&&saved.version===1&&saved.pages&&typeof saved.pages==="object")inkData=saved;
}catch(error){
  console.warn("手書きデータを読み込めませんでした。",error);
}

function pageInk(){
  const key=String(currentPage);
  if(!Array.isArray(inkData.pages[key]))inkData.pages[key]=[];
  return inkData.pages[key];
}

function saveInk(){
  try{
    localStorage.setItem(inkStorageKey,JSON.stringify(inkData));
    return true;
  }catch(error){
    console.error(error);
    inkState.textContent="手書きを保存できませんでした。";
    inkState.hidden=false;
    return false;
  }
}

function svgPointForStored(point,page){
  return{
    x:PAGE_SIDE_MARGIN+point.x*page.width,
    y:PAGE_TOP_BOTTOM_MARGIN+point.y*page.height
  };
}

function strokePath(stroke,page){
  const pts=stroke.points||[];
  if(!pts.length)return"";
  const first=svgPointForStored(pts[0],page);
  if(pts.length===1)return`M ${first.x.toFixed(2)} ${first.y.toFixed(2)} l .01 .01`;
  return "M "+pts.map((pt,index)=>{
    const p=svgPointForStored(pt,page);
    return `${index?"L ":""}${p.x.toFixed(2)} ${p.y.toFixed(2)}`;
  }).join(" ");
}

function renderInk(){
  if(!pages.length)return;
  const page=pages[currentPage];
  const strokes=pageInk();
  inkStrokes.replaceChildren();

  for(const stroke of strokes){
    const path=document.createElementNS("http://www.w3.org/2000/svg","path");
    path.setAttribute("d",strokePath(stroke,page));
    path.setAttribute("fill","none");
    path.setAttribute("stroke",stroke.color||"#d92d20");
    path.setAttribute("stroke-width",String(Number(stroke.width)||4));
    path.setAttribute("stroke-linecap","round");
    path.setAttribute("stroke-linejoin","round");
    inkStrokes.appendChild(path);
  }
}

function configureInkOverlay(fullWidth,fullHeight){
  currentFullWidth=Math.max(1,fullWidth);
  currentFullHeight=Math.max(1,fullHeight);
  inkOverlay.setAttribute("viewBox",`0 0 ${currentFullWidth} ${currentFullHeight}`);
  renderInk();
}

function eventToPagePoint(event){
  if(!pages.length)return null;
  const rect=inkOverlay.getBoundingClientRect();
  if(!rect.width||!rect.height)return null;
  const x=(event.clientX-rect.left)/rect.width*currentFullWidth;
  const y=(event.clientY-rect.top)/rect.height*currentFullHeight;
  const page=pages[currentPage];
  const px=x-PAGE_SIDE_MARGIN;
  const py=y-PAGE_TOP_BOTTOM_MARGIN;
  if(px<0||py<0||px>page.width||py>page.height)return null;
  return{
    x:px/page.width,
    y:py/page.height,
    pageX:px,
    pageY:py
  };
}

function distanceToSegment(px,py,ax,ay,bx,by){
  const vx=bx-ax,vy=by-ay,wx=px-ax,wy=py-ay;
  const len2=vx*vx+vy*vy;
  const t=len2?Math.max(0,Math.min(1,(wx*vx+wy*vy)/len2)):0;
  const dx=px-(ax+t*vx),dy=py-(ay+t*vy);
  return Math.hypot(dx,dy);
}

function strokeTouches(stroke,point,page){
  const pts=stroke.points||[];
  if(!pts.length)return false;
  const threshold=Math.max(10,(Number(stroke.width)||4)+7);
  const converted=pts.map(p=>({x:p.x*page.width,y:p.y*page.height}));
  if(converted.length===1)return Math.hypot(point.pageX-converted[0].x,point.pageY-converted[0].y)<=threshold;
  for(let i=1;i<converted.length;i++){
    if(distanceToSegment(point.pageX,point.pageY,converted[i-1].x,converted[i-1].y,converted[i].x,converted[i].y)<=threshold)return true;
  }
  return false;
}

function eraseAt(point){
  const page=pages[currentPage],strokes=pageInk();
  let changed=false;
  for(let i=strokes.length-1;i>=0;i--){
    if(strokeTouches(strokes[i],point,page)){
      strokes.splice(i,1);
      changed=true;
    }
  }
  if(changed){
    eraseChanged=true;
    renderInk();
  }
}

function updateInkUi(){
  document.querySelectorAll("[data-ink-tool]").forEach(button=>{
    button.classList.toggle("on",button.dataset.inkTool===inkTool);
  });
  document.querySelectorAll("[data-ink-width]").forEach(button=>{
    button.classList.toggle("on",Number(button.dataset.inkWidth)===inkWidth);
  });
  document.querySelectorAll("[data-ink-color]").forEach(button=>{
    button.classList.toggle("on",button.dataset.inkColor.toLowerCase()===inkColor.toLowerCase());
  });
  document.getElementById("inkCustomColor").value=inkColor;
  inkOverlay.classList.toggle("is-drawing",inkActive);
  inkActiveBar.hidden=!inkActive;
  inkState.hidden=!inkActive;
  if(inkActive){
    inkState.textContent=inkTool==="eraser"
      ?"消しゴム：触れた手書きを消します"
      :"手書き中：指・タッチペン・マウスで書けます";
  }
}

function openInkPopup(clientX=null,clientY=null){
  updateInkUi();
  inkPopup.hidden=false;

  if(window.innerWidth<=700)return;

  const margin=10;
  const width=340;
  const height=inkPopup.offsetHeight||330;
  const x=clientX==null?window.innerWidth/2:clientX;
  const y=clientY==null?window.innerHeight/2:clientY;
  inkPopup.style.left=Math.max(margin,Math.min(window.innerWidth-width-margin,x-width/2))+"px";
  inkPopup.style.top=Math.max(margin,Math.min(window.innerHeight-height-margin,y-height/2))+"px";
}

function closeInkPopup(){
  inkPopup.hidden=true;
}

function startInkMode(){
  inkActive=true;
  closeInkPopup();
  updateInkUi();
}

function finishInkMode(){
  inkActive=false;
  activeStroke=null;
  activePointerId=null;
  inkCurrent.setAttribute("d","");
  closeInkPopup();
  updateInkUi();
}

document.querySelectorAll("[data-ink-tool]").forEach(button=>{
  button.addEventListener("click",()=>{
    inkTool=button.dataset.inkTool;
    updateInkUi();
  });
});

document.querySelectorAll("[data-ink-width]").forEach(button=>{
  button.addEventListener("click",()=>{
    inkWidth=Number(button.dataset.inkWidth)||4;
    updateInkUi();
  });
});

document.querySelectorAll("[data-ink-color]").forEach(button=>{
  button.addEventListener("click",()=>{
    inkColor=button.dataset.inkColor;
    inkTool="pen";
    updateInkUi();
  });
});

document.getElementById("inkCustomColor").addEventListener("input",event=>{
  inkColor=event.target.value;
  inkTool="pen";
  updateInkUi();
});

document.getElementById("inkClose").onclick=closeInkPopup;
document.getElementById("inkStart").onclick=startInkMode;
document.getElementById("inkSettings").onclick=()=>openInkPopup();
document.getElementById("inkFinish").onclick=finishInkMode;

document.getElementById("inkUndo").onclick=()=>{
  const strokes=pageInk();
  if(strokes.length){
    strokes.pop();
    saveInk();
    renderInk();
  }
};

inkOverlay.addEventListener("dblclick",event=>{
  if(isFullscreenActive()||inkActive)return;
  event.preventDefault();
  openInkPopup(event.clientX,event.clientY);
});

inkOverlay.addEventListener("pointerdown",event=>{
  if(!event.isPrimary)return;

  if(!inkActive)return;

  const point=eventToPagePoint(event);
  if(!point)return;

  event.preventDefault();
  activePointerId=event.pointerId;
  inkOverlay.setPointerCapture(event.pointerId);

  if(inkTool==="eraser"){
    eraseChanged=false;
    eraseAt(point);
    return;
  }

  activeStroke={
    id:(crypto.randomUUID?.()||String(Date.now())+"-"+Math.random()),
    color:inkColor,
    width:inkWidth,
    points:[{x:point.x,y:point.y}]
  };
  const page=pages[currentPage];
  inkCurrent.setAttribute("stroke",inkColor);
  inkCurrent.setAttribute("stroke-width",String(inkWidth));
  inkCurrent.setAttribute("d",strokePath(activeStroke,page));
});

inkOverlay.addEventListener("pointermove",event=>{
  if(!inkActive||event.pointerId!==activePointerId)return;
  const point=eventToPagePoint(event);
  if(!point)return;
  event.preventDefault();

  if(inkTool==="eraser"){
    eraseAt(point);
    return;
  }

  if(!activeStroke)return;
  const points=activeStroke.points;
  const last=points[points.length-1];
  const page=pages[currentPage];
  const dx=(point.x-last.x)*page.width;
  const dy=(point.y-last.y)*page.height;
  if(Math.hypot(dx,dy)<1.4)return;

  points.push({x:point.x,y:point.y});
  inkCurrent.setAttribute("d",strokePath(activeStroke,page));
});

function finishPointer(event){
  if(event.pointerId!==activePointerId)return;

  if(inkTool==="eraser"){
    if(eraseChanged)saveInk();
  }else if(activeStroke){
    pageInk().push(activeStroke);
    activeStroke=null;
    inkCurrent.setAttribute("d","");
    saveInk();
    renderInk();
  }

  try{inkOverlay.releasePointerCapture(event.pointerId)}catch(error){}
  activePointerId=null;
}

inkOverlay.addEventListener("pointerup",finishPointer);
inkOverlay.addEventListener("pointercancel",event=>{
  if(event.pointerId!==activePointerId)return;
  activeStroke=null;
  inkCurrent.setAttribute("d","");
  activePointerId=null;
});

/* 指・ペンのダブルタップでも設定を開く（通常閲覧時のみ） */
inkOverlay.addEventListener("pointerup",event=>{
  if(isFullscreenActive()||inkActive||event.pointerType==="mouse")return;
  const now=performance.now();
  const current={x:event.clientX,y:event.clientY};
  const closeEnough=lastTapPoint&&Math.hypot(current.x-lastTapPoint.x,current.y-lastTapPoint.y)<28;
  if(closeEnough&&now-lastTapTime<380){
    event.preventDefault();
    lastTapTime=0;
    lastTapPoint=null;
    openInkPopup(event.clientX,event.clientY);
  }else{
    lastTapTime=now;
    lastTapPoint=current;
  }
});

updateInkUi();

/* 全画面表示は閲覧専用。
   1タップ＝全画面終了。
   右→左スワイプ＝次ページ、左→右スワイプ＝前ページ。
   タブレットではブラウザのスクロール判定に奪われないよう、
   Pointer Events を capture で受け、古い環境には Touch Events を補助する。 */
let fullscreenGesture=null;
let touchGesture=null;
const SWIPE_MAX_VERTICAL_RATIO=.9;
const SWIPE_MAX_MS=1200;

function swipeMinimum(){
  const width=window.visualViewport?.width||window.innerWidth;
  return Math.max(38,Math.min(72,width*.065));
}

function animatePageSwipe(direction){
  const className=direction==="next"?"page-swipe-next":"page-swipe-prev";
  stage.classList.remove("page-swipe-next","page-swipe-prev");
  stage.classList.add(className);
  window.setTimeout(()=>stage.classList.remove(className),130);
}

function handleFullscreenGesture(startX,startY,endX,endY,startTime,event){
  if(!isFullscreenActive())return;

  const dx=endX-startX;
  const dy=endY-startY;
  const elapsed=performance.now()-startTime;
  const absX=Math.abs(dx);
  const absY=Math.abs(dy);
  const minSwipe=swipeMinimum();

  const isSwipe=
    pages.length>1 &&
    elapsed<=SWIPE_MAX_MS &&
    absX>=minSwipe &&
    absY<=Math.max(48,absX*SWIPE_MAX_VERTICAL_RATIO);

  if(isSwipe){
    event?.preventDefault?.();

    if(dx<0&&currentPage<pages.length-1){
      animatePageSwipe("next");
      showPage(currentPage+1);
      return;
    }

    if(dx>0&&currentPage>0){
      animatePageSwipe("prev");
      showPage(currentPage-1);
      return;
    }

    /* 最初／最後のページで外側へスワイプしても終了しない */
    return;
  }

  /* ごく小さい移動だけを「タップ」と判定する */
  if(absX<26&&absY<26&&elapsed<800){
    event?.preventDefault?.();
    exitFullscreenView();
  }
}

/* Pointer Events 対応タブレット */
stage.addEventListener("pointerdown",event=>{
  if(!isFullscreenActive()||!event.isPrimary)return;

  fullscreenGesture={
    pointerId:event.pointerId,
    startX:event.clientX,
    startY:event.clientY,
    startTime:performance.now()
  };

  try{stage.setPointerCapture(event.pointerId)}catch(error){}
},{capture:true});

stage.addEventListener("pointermove",event=>{
  if(!isFullscreenActive()||!fullscreenGesture||fullscreenGesture.pointerId!==event.pointerId)return;
  /* Android / タブレットで横スワイプをブラウザ操作へ渡さない */
  event.preventDefault();
},{capture:true});

stage.addEventListener("pointercancel",event=>{
  if(fullscreenGesture?.pointerId===event.pointerId)fullscreenGesture=null;
},{capture:true});

stage.addEventListener("pointerup",event=>{
  if(!fullscreenGesture||fullscreenGesture.pointerId!==event.pointerId)return;

  const gesture=fullscreenGesture;
  fullscreenGesture=null;

  try{stage.releasePointerCapture(event.pointerId)}catch(error){}

  handleFullscreenGesture(
    gesture.startX,
    gesture.startY,
    event.clientX,
    event.clientY,
    gesture.startTime,
    event
  );
},{capture:true});

/* Pointer Events が無い古いタブレット向け */
if(!("PointerEvent" in window)){
  stage.addEventListener("touchstart",event=>{
    if(!isFullscreenActive()||event.touches.length!==1)return;
    const touch=event.touches[0];
    touchGesture={
      startX:touch.clientX,
      startY:touch.clientY,
      startTime:performance.now()
    };
    event.preventDefault();
  },{passive:false,capture:true});

  stage.addEventListener("touchmove",event=>{
    if(!isFullscreenActive()||!touchGesture)return;
    event.preventDefault();
  },{passive:false,capture:true});

  stage.addEventListener("touchend",event=>{
    if(!touchGesture)return;
    const touch=event.changedTouches[0];
    const gesture=touchGesture;
    touchGesture=null;
    if(!touch)return;

    handleFullscreenGesture(
      gesture.startX,
      gesture.startY,
      touch.clientX,
      touch.clientY,
      gesture.startTime,
      event
    );
  },{passive:false,capture:true});

  stage.addEventListener("touchcancel",()=>{
    touchGesture=null;
  },{capture:true});
}

/* 選択譜面を、文化譜アプリ本来の読込キーへ一時的に置く */

const previousEditorData=localStorage.getItem(EDIT_KEY);
try{
  localStorage.setItem(EDIT_KEY,JSON.stringify(score));
}catch(error){
  loading.textContent="文化譜データを準備できませんでした。";
  return;
}

const restoreEditorData=()=>{
  try{
    if(previousEditorData===null)localStorage.removeItem(EDIT_KEY);
    else localStorage.setItem(EDIT_KEY,previousEditorData);
  }catch(error){}
};

let currentPage=0;
let pages=[];
let documentSize={width:0,height:0};

function waitFrames(count=2){
  return new Promise(resolve=>{
    const step=()=>{
      if(--count<=0)resolve();
      else requestAnimationFrame(step);
    };
    requestAnimationFrame(step);
  });
}

async function waitForStableNormalLayout(w,d){
  if(d.fonts){
    try{
      await d.fonts.load('16px "Shian 851 MkPOP"');
      await d.fonts.ready;
    }catch(error){}
  }

  const paper=d.querySelector(".paper");
  const scoreArea=d.querySelector("#scoreArea");
  if(!paper||!scoreArea)throw new Error("通常譜面が見つかりません");

  let previous="";
  let stableCount=0;

  for(let i=0;i<90;i++){
    await waitFrames(1);

    const paperRect=paper.getBoundingClientRect();
    const scoreRect=scoreArea.getBoundingClientRect();
    const staffCount=scoreArea.querySelectorAll(".staff").length;
    const annotationCount=d.querySelectorAll("#annotations [data-item],#annotations .annotation-item").length;

    const signature=[
      Math.round(paperRect.width*100)/100,
      Math.round(paperRect.height*100)/100,
      Math.round(scoreRect.width*100)/100,
      Math.round(scoreRect.height*100)/100,
      staffCount,
      annotationCount
    ].join("|");

    if(signature===previous)stableCount++;
    else stableCount=0;

    previous=signature;
    if(stableCount>=5)return;
  }
}

function collectExactPrintCss(w,d){
  let css="";
  for(const sheet of [...d.styleSheets]){
    let rules;
    try{rules=[...sheet.cssRules]}catch(error){continue}

    for(const rule of rules){
      if(
        rule.type===w.CSSRule.MEDIA_RULE &&
        String(rule.conditionText||"").toLowerCase().includes("print")
      ){
        for(const child of [...rule.cssRules]){
          css+=child.cssText+"\n";
        }
      }
    }
  }
  return css;
}

function measurePrintedPage(page){
  const rect=page.getBoundingClientRect();
  let left=rect.left;
  let right=rect.right;
  let top=rect.top;
  let bottom=rect.bottom;

  /*
    SVGコメントや端の部品を含めた実描画域も確認する。
    ただし印刷ページ本体より小さくはしない。
  */
  for(const element of page.querySelectorAll("*")){
    const r=element.getBoundingClientRect();
    if(!(r.width>0||r.height>0))continue;
    left=Math.min(left,r.left);
    right=Math.max(right,r.right);
    top=Math.min(top,r.top);
    bottom=Math.max(bottom,r.bottom);
  }

  return{
    left,
    top,
    width:Math.max(rect.width,right-left),
    height:Math.max(rect.height,bottom-top),
    right,
    bottom
  };
}

function showPage(index){
  if(!pages.length)return;

  currentPage=Math.max(0,Math.min(index,pages.length-1));
  const page=pages[currentPage];

  /*
    v3.4:
    デバイス／ウィンドウの実表示領域を取得し、
    文化譜1ページ全体が必ず画面内へ収まる倍率を自動計算する。
    横幅だけでなく高さも判定する。
  */
  const viewportWidth=window.visualViewport?.width||window.innerWidth;
  const viewportHeight=window.visualViewport?.height||window.innerHeight;
  const fullscreen=isFullscreenActive();
  const headerRect=document.querySelector("header")?.getBoundingClientRect();
  const headerHeight=fullscreen?0:Math.ceil(headerRect?.height||58);

  const availableWidth=Math.max(280,viewportWidth-(fullscreen?4:24));
  const availableHeight=Math.max(280,viewportHeight-headerHeight-(fullscreen?4:28));

  const fullWidth=page.width+PAGE_SIDE_MARGIN*2;
  const fullHeight=page.height+PAGE_TOP_BOTTOM_MARGIN*2;

  const widthScale=availableWidth/fullWidth;
  const heightScale=availableHeight/fullHeight;
  const maxScale=fullscreen?2.5:MAX_VIEW_SCALE;
  const scale=Math.min(maxScale,widthScale,heightScale);

  stage.style.width=(fullWidth*scale)+"px";
  stage.style.height=(fullHeight*scale)+"px";
  configureInkOverlay(fullWidth,fullHeight);

  frame.style.width=documentSize.width+"px";
  frame.style.height=documentSize.height+"px";
  frame.style.left=((PAGE_SIDE_MARGIN-page.left)*scale)+"px";
  frame.style.top=((PAGE_TOP_BOTTOM_MARGIN-page.top)*scale)+"px";
  frame.style.transform=`scale(${scale})`;

  document.getElementById("count").textContent=
    `${currentPage+1} / ${pages.length} ページ`;
  document.getElementById("prev").disabled=currentPage===0;
  document.getElementById("next").disabled=currentPage===pages.length-1;
  document.getElementById("pager").hidden=pages.length<=1;

  window.scrollTo({top:0,behavior:"instant"});
}

document.getElementById("prev").onclick=()=>{activeStroke=null;activePointerId=null;inkCurrent.setAttribute("d","");showPage(currentPage-1)};
document.getElementById("next").onclick=()=>{activeStroke=null;activePointerId=null;inkCurrent.setAttribute("d","");showPage(currentPage+1)};
window.addEventListener("resize",()=>showPage(currentPage),{passive:true});
window.visualViewport?.addEventListener("resize",()=>showPage(currentPage),{passive:true});

frame.addEventListener("load",async()=>{
  try{
    const w=frame.contentWindow;
    const d=frame.contentDocument;
    if(!w||!d)throw new Error("文化譜アプリへアクセスできません");

    /*
      最重要点:
      固定1200pxにはしない。
      ユーザーが文化譜作成アプリを普通に開く時と同じ
      「現在のブラウザ表示幅」で初回描画させる。
      print-v2.js のコメント位置変換は、この通常画面の実座標を参照するため。
    */
    const normalViewportWidth=Math.max(900,window.innerWidth);
    const normalViewportHeight=Math.max(700,window.innerHeight);

    frame.style.width=normalViewportWidth+"px";
    frame.style.height=normalViewportHeight+"px";

    await waitForStableNormalLayout(w,d);

    /*
      文化譜作成アプリ本来の beforeprint 経路を使う。
      #printRootV2 が空なら ensurePrintLayout() → applyPrintLayout()
      → ShianPrintV2.render() が実行される。
    */
    w.dispatchEvent(new w.Event("beforeprint"));
    await waitFrames(3);

    const printRoot=d.querySelector("#printRootV2");
    if(!printRoot)throw new Error("印刷ルートがありません");

    let printedPages=[...printRoot.querySelectorAll(".pv2-page")];
    if(!printedPages.length)throw new Error("印刷ページが生成されませんでした");

    /*
      native印刷で使用される @media print の中身を、
      セレクタを書き換えず、そのまま画面表示へ適用する。
    */
    const exactPrintCss=collectExactPrintCss(w,d);
    if(!exactPrintCss.trim())throw new Error("印刷CSSを取得できませんでした");

    const screenPrintStyle=d.createElement("style");
    screenPrintStyle.id="scorebook-native-print-view";
    screenPrintStyle.textContent=exactPrintCss+`
      html,body{
        margin:0!important;
        padding:0!important;
        background:#fff!important;
      }
      body{
        overflow:visible!important;
      }
      body>main.app{
        display:none!important;
      }
      .print-root{
        display:none!important;
      }
      .shian-print-v2{
        display:block!important;
        margin:0!important;
        padding:0!important;
        background:#fff!important;
      }
      .pv2-page{
        display:block!important;
        margin:0!important;
      }
    `;
    d.head.appendChild(screenPrintStyle);

    await waitFrames(3);

    printedPages=[...printRoot.querySelectorAll(".pv2-page")];
    pages=printedPages.map(measurePrintedPage);

    if(!pages.length||!pages[0].width||!pages[0].height){
      throw new Error("印刷ページ寸法を取得できませんでした");
    }

    /*
      ここから先は印刷DOMの位置を変更しない。
      iframe全体を外側から移動・拡大縮小するだけ。
    */
    documentSize.width=Math.max(
      d.documentElement.scrollWidth,
      d.body.scrollWidth,
      ...pages.map(page=>Math.ceil(page.right+PAGE_SIDE_MARGIN))
    );
    documentSize.height=Math.max(
      d.documentElement.scrollHeight,
      d.body.scrollHeight,
      ...pages.map(page=>Math.ceil(page.bottom+PAGE_TOP_BOTTOM_MARGIN))
    );

    /*
      viewerを閉じる時、文化譜作成アプリのpagehide/saveが
      本来の編集データへ閲覧用譜面を書き戻さないよう遮断する。
    */
    try{
      const proto=w.Storage.prototype;
      const originalSetItem=proto.setItem;
      proto.setItem=function(key,value){
        if(this===w.localStorage&&key===EDIT_KEY)return;
        return originalSetItem.call(this,key,value);
      };
    }catch(error){}

    restoreEditorData();
    sessionStorage.removeItem(VIEW_KEY);
    sessionStorage.removeItem(VIEW_ITEM_KEY);

    showPage(0);
    loading.remove();

  }catch(error){
    console.error(error);
    restoreEditorData();
    loading.textContent="印刷用の文化譜を表示できませんでした。";
  }
});

/*
  読み込み開始時点から「現在のブラウザ幅」を与える。
  display:none にはせず、実レイアウトを作らせる。
*/
frame.style.width=Math.max(900,window.innerWidth)+"px";
frame.style.height=Math.max(700,window.innerHeight)+"px";
frame.src=APP_URL;

})();
</script>
</body>
</html>
