<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>文化譜を見る｜文化譜面帳</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;background:#e6dfd5;color:#332c25;font-family:"Yu Gothic",sans-serif}
.viewer-head{
 position:sticky;top:0;z-index:100;height:58px;background:#fffaf3;border-bottom:1px solid #d8cbbd;
 display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:16px;
 padding:0 max(14px,calc((100vw - 1120px)/2))
}
.viewer-title{font-family:"Yu Mincho",serif;font-size:19px;font-weight:500;white-space:nowrap}
.pager{display:flex;align-items:center;justify-content:center;gap:10px;white-space:nowrap}
.pager button,.back{
 border:1px solid #abc2ca;border-radius:9px;background:#f7fbfc;color:#315f70;
 font-weight:700;padding:8px 13px;cursor:pointer;white-space:nowrap
}
.pager button:disabled{opacity:.35;cursor:default}
.count{min-width:82px;text-align:center;font-size:13px}
.back{justify-self:end}
.stage{padding:18px 12px 34px;display:flex;justify-content:center;align-items:flex-start;overflow:auto}
.paper-shell{position:relative;background:#fff;box-shadow:0 2px 12px rgba(0,0,0,.16);overflow:hidden}
#paperFrame{position:absolute;left:0;top:0;border:0;background:#fff;transform-origin:top left}
#source{position:fixed;left:-30000px;top:0;width:1200px;height:900px;border:0;visibility:hidden;pointer-events:none}
.loading{position:fixed;inset:58px 0 0;z-index:90;display:grid;place-items:center;background:#e6dfd5;color:#6e6156}
@media(max-width:760px){
 .viewer-head{height:auto;min-height:58px;grid-template-columns:1fr auto;padding:7px 10px;gap:7px}
 .viewer-title{font-size:16px}.back{grid-column:2;grid-row:1}
 .pager{grid-column:1/3;grid-row:2;padding-bottom:2px}
 .pager button,.back{padding:7px 9px;font-size:12px}
 .loading{inset:96px 0 0}.stage{padding:10px 4px 24px}
}
</style>
</head>
<body>
<header class="viewer-head">
 <div class="viewer-title">文化譜を見る</div>
 <div class="pager" id="pager" hidden>
  <button id="prev" type="button">← 前のページ</button>
  <span class="count" id="count"></span>
  <button id="next" type="button">次のページ →</button>
 </div>
 <button class="back" id="back" type="button">← 文化譜面帳へ戻る</button>
</header>
<main class="stage">
 <div class="paper-shell" id="shell"><iframe id="paperFrame" title="文化譜ページ"></iframe></div>
</main>
<div class="loading" id="loading">印刷プレビュー形式で文化譜を準備しています…</div>
<iframe id="source" title="文化譜描画元"></iframe>

<script>
(async()=>{
 const KEY="shian-scorebook-view-score";
 const EDITOR_URL="https://itohen0716.github.io/sianhu/";
 const raw=sessionStorage.getItem(KEY);
 const source=document.getElementById("source");
 const paperFrame=document.getElementById("paperFrame");
 const shell=document.getElementById("shell");
 const loading=document.getElementById("loading");
 document.getElementById("back").onclick=()=>location.href="./index.html";

 if(!raw){loading.textContent="表示する文化譜が選択されていません。";return}
 let payload;
 try{payload=JSON.parse(raw)}catch{loading.textContent="文化譜データを読み込めませんでした。";return}
 const score=payload&&payload.score&&typeof payload.score==="object"?payload.score:payload;

 try{
   localStorage.setItem("shian-bunkafu-editor-v2",JSON.stringify(score));
   const res=await fetch(EDITOR_URL,{cache:"no-store"});
   if(!res.ok)throw new Error("文化譜アプリを取得できません。");
   let html=await res.text();
   html=html.replace(/<head([^>]*)>/i,'<head$1><base href="'+EDITOR_URL+'">');
   source.srcdoc=html;
 }catch(e){
   console.error(e);loading.textContent="文化譜を表示できませんでした。";return;
 }

 source.addEventListener("load",async()=>{
   try{
     const win=source.contentWindow,doc=source.contentDocument;
     if(!win||!doc)throw new Error("描画元を操作できません。");

     win.localStorage.setItem("shian-bunkafu-editor-v2",JSON.stringify(score));
     win.dispatchEvent(new win.Event("pageshow"));
     if(doc.fonts)try{await doc.fonts.ready}catch{}

     for(let i=0;i<80&&!win.ShianPrintV2;i++)await new Promise(r=>setTimeout(r,50));
     if(!win.ShianPrintV2)throw new Error("印刷描画機能を確認できません。");

     const printBtn=doc.getElementById("printPreview");
     if(!printBtn)throw new Error("印刷プレビュー機能を確認できません。");
     printBtn.click();
     await new Promise(r=>setTimeout(r,100));

     const dialog=doc.getElementById("printDialog");
     if(dialog?.open)dialog.close();

     win.dispatchEvent(new win.Event("beforeprint"));
     await new Promise(r=>requestAnimationFrame(()=>requestAnimationFrame(r)));

     const root=doc.getElementById("printRootV2");
     const pages=[...(root?.querySelectorAll(".pv2-page")||[])];
     if(!pages.length)throw new Error("印刷ページを生成できません。");

     const snapshots=pages.map(p=>p.outerHTML);
     let current=0;

     // Physical A4-ish print dimensions used by the culture-score print renderer.
     const MM_TO_PX=96/25.4, PAGE_W=196*MM_TO_PX, PAGE_H=283*MM_TO_PX;

     function pageDocument(markup){
       return `<!doctype html><html><head>
       <meta charset="utf-8"><base href="${EDITOR_URL}">
       <link rel="stylesheet" href="${EDITOR_URL}print-v2.css?v=209">
       <style>
       @font-face{font-family:"Shian Score BIZ UDPMincho";src:url("${EDITOR_URL}fonts/BIZUDPMincho-Regular.ttf") format("truetype")}
       @font-face{font-family:"Shian 851 MkPOP";src:url("${EDITOR_URL}fonts/851MkPOP_101.ttf") format("truetype")}
       html,body{margin:0;padding:0;width:${PAGE_W}px;min-height:${PAGE_H}px;background:#fff;overflow:hidden}
       .shian-print-v2{display:block!important;background:#fff;color:#332c25;font-family:"Yu Gothic",sans-serif}
       .pv2-page{display:block!important;width:196mm!important;min-height:283mm!important;overflow:hidden!important;background:#fff!important;color:#332c25!important}
       </style></head><body><div class="shian-print-v2">${markup}</div>
       <script>
       // Activate only the print renderer rules INSIDE this isolated page iframe.
       addEventListener("DOMContentLoaded",()=>{
         for(const sheet of [...document.styleSheets]){
           let rules;try{rules=[...sheet.cssRules]}catch{continue}
           for(const rule of rules){
             if(rule.type===CSSRule.MEDIA_RULE&&[...rule.media].some(m=>m==="print")){
               const st=document.createElement("style");
               st.textContent=[...rule.cssRules].map(r=>r.cssText).join("\\n").replace(/body>main\\.app\\{[^}]*\\}/g,"");
               document.head.appendChild(st);
             }
           }
         }
       });
       <\/script></body></html>`;
     }

     function fit(){
       const maxW=Math.min(window.innerWidth-24,1120);
       const maxH=Math.max(420,window.innerHeight-92);
       const scale=Math.min(1,maxW/PAGE_W,maxH/PAGE_H);
       paperFrame.style.width=PAGE_W+"px";
       paperFrame.style.height=PAGE_H+"px";
       paperFrame.style.transform=`scale(${scale})`;
       shell.style.width=(PAGE_W*scale)+"px";
       shell.style.height=(PAGE_H*scale)+"px";
     }

     function show(i){
       current=Math.max(0,Math.min(snapshots.length-1,i));
       paperFrame.srcdoc=pageDocument(snapshots[current]);
       document.getElementById("count").textContent=`${current+1} / ${snapshots.length} ページ`;
       document.getElementById("prev").disabled=current===0;
       document.getElementById("next").disabled=current===snapshots.length-1;
       document.getElementById("pager").hidden=snapshots.length<=1;
       fit();
       window.scrollTo({top:0,behavior:"instant"});
     }

     document.getElementById("prev").onclick=()=>show(current-1);
     document.getElementById("next").onclick=()=>show(current+1);
     window.addEventListener("resize",fit,{passive:true});
     show(0);
     loading.remove();
     sessionStorage.removeItem(KEY);
   }catch(e){
     console.error(e);
     loading.textContent="印刷プレビュー形式の譜面を生成できませんでした。";
   }
 });
})();
</script>
</body>
</html>
