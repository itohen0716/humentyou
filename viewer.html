<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>文化譜を見る｜文化譜面帳</title>
<style>
html,body{margin:0;min-height:100%;background:#e6dfd5;color:#332c25;font-family:"Yu Gothic",sans-serif}
.viewer-head{position:sticky;top:0;z-index:50;height:58px;background:#fffaf3;border-bottom:1px solid #d8cbbd;display:grid;grid-template-columns:1fr auto 1fr;align-items:center;padding:0 max(14px,calc((100vw - 1060px)/2));box-sizing:border-box}
.viewer-head strong{font-family:"Yu Mincho",serif;font-size:19px;font-weight:500}.pager{display:flex;align-items:center;gap:9px}.pager button,.back{border:1px solid #abc2ca;border-radius:9px;background:#f7fbfc;color:#315f70;font-weight:700;padding:8px 13px;cursor:pointer}.pager button:disabled{opacity:.35;cursor:default}.count{min-width:72px;text-align:center;font-size:13px}.back{justify-self:end}
.stage{padding:18px 12px 34px;display:flex;justify-content:center;align-items:flex-start}.paper-shell{background:white;box-shadow:0 2px 12px #0002;overflow:hidden}.page-host{background:white;transform-origin:top left}
#source{position:fixed;left:-20000px;top:0;width:1200px;height:900px;border:0;visibility:hidden}.loading{position:fixed;inset:58px 0 0;display:grid;place-items:center;background:#e6dfd5;z-index:20;color:#6e6156}
@media(max-width:700px){.viewer-head{grid-template-columns:1fr auto;height:auto;min-height:58px;padding:7px 10px;gap:7px}.viewer-head strong{font-size:16px}.pager{grid-row:2;grid-column:1/3;justify-content:center}.back{grid-column:2;grid-row:1}.stage{padding:10px 4px 24px}}
</style></head>
<body>
<header class="viewer-head"><strong>文化譜を見る</strong><div class="pager" id="pager" hidden><button id="prev" type="button">← 前のページ</button><span class="count" id="count"></span><button id="next" type="button">次のページ →</button></div><button class="back" id="back" type="button">← 文化譜面帳へ戻る</button></header>
<main class="stage"><div class="paper-shell" id="shell"><div class="page-host" id="host"></div></div></main>
<div class="loading" id="loading">印刷プレビュー形式で文化譜を準備しています…</div>
<iframe id="source" title="文化譜描画元"></iframe>
<script>
(async()=>{
 const KEY="shian-scorebook-view-score",EDITOR_URL="https://itohen0716.github.io/sianhu/";
 const raw=sessionStorage.getItem(KEY),source=document.getElementById("source"),host=document.getElementById("host"),shell=document.getElementById("shell"),loading=document.getElementById("loading");
 document.getElementById("back").onclick=()=>location.href="./index.html";
 if(!raw){loading.textContent="表示する文化譜が選択されていません。";return}
 let payload;try{payload=JSON.parse(raw)}catch{loading.textContent="文化譜データを読み込めませんでした。";return}
 const score=payload&&payload.score&&typeof payload.score==="object"?payload.score:payload;
 try{
   localStorage.setItem("shian-bunkafu-editor-v2",JSON.stringify(score));
   const res=await fetch(EDITOR_URL,{cache:"no-store"});if(!res.ok)throw new Error("文化譜アプリを取得できません。");
   let html=await res.text();html=html.replace(/<head([^>]*)>/i,'<head$1><base href="'+EDITOR_URL+'">');source.srcdoc=html;
 }catch(e){console.error(e);loading.textContent="文化譜を表示できませんでした。";return}

 source.addEventListener("load",async()=>{
   try{
     const win=source.contentWindow,doc=source.contentDocument;if(!win||!doc)throw new Error("描画元を操作できません。");
     win.localStorage.setItem("shian-bunkafu-editor-v2",JSON.stringify(score));
     win.dispatchEvent(new win.Event("pageshow"));
     if(doc.fonts)try{await doc.fonts.ready}catch{}
     // Wait for the current editor's external print renderer to be ready.
     for(let i=0;i<80&&!win.ShianPrintV2;i++)await new Promise(r=>setTimeout(r,50));
     if(!win.ShianPrintV2)throw new Error("印刷描画機能を確認できません。");
     // Use the editor's own print-preview button to create exactly the same page plan.
     const printBtn=doc.getElementById("printPreview");
     if(!printBtn)throw new Error("印刷プレビュー機能を確認できません。");
     printBtn.click();
     await new Promise(r=>setTimeout(r,80));
     const form=doc.getElementById("printForm"),dialog=doc.getElementById("printDialog");
     if(dialog?.open)dialog.close();
     // The render function is exposed; use current editor helpers indirectly by submitting is not desired.
     // applyPrintLayout is in the page lexical scope, so trigger beforeprint: ensurePrintLayout builds root if empty.
     win.dispatchEvent(new win.Event("beforeprint"));
     await new Promise(r=>requestAnimationFrame(()=>requestAnimationFrame(r)));
     const root=doc.getElementById("printRootV2"),pages=[...(root?.querySelectorAll(".pv2-page")||[])];
     if(!pages.length)throw new Error("印刷ページを生成できません。");

     // Bring the print stylesheet into this viewer, but activate only its @media-print rules
     // by copying the generated page and adding screen equivalents for the page container.
     const link=document.createElement("link");link.rel="stylesheet";link.href=EDITOR_URL+"print-v2.css?v=209";document.head.appendChild(link);
     const fontStyle=document.createElement("style");fontStyle.textContent=`@font-face{font-family:"Shian Score BIZ UDPMincho";src:url("${EDITOR_URL}fonts/BIZUDPMincho-Regular.ttf")}@font-face{font-family:"Shian 851 MkPOP";src:url("${EDITOR_URL}fonts/851MkPOP_101.ttf")}`;document.head.appendChild(fontStyle);

     let current=0;
     const snapshots=pages.map(p=>p.cloneNode(true));
     function fit(){
       const page=host.firstElementChild;if(!page)return;
       const naturalW=196*96/25.4,naturalH=283*96/25.4;
       const maxW=Math.min(window.innerWidth-24,1060),scale=Math.min(1,maxW/naturalW);
       host.style.width=naturalW+"px";host.style.height=naturalH+"px";host.style.transform=`scale(${scale})`;
       shell.style.width=(naturalW*scale)+"px";shell.style.height=(naturalH*scale)+"px";
     }
     function show(i){
       current=Math.max(0,Math.min(snapshots.length-1,i));host.replaceChildren(snapshots[current].cloneNode(true));
       const page=host.firstElementChild;
       page.style.display="block";page.style.width="196mm";page.style.minHeight="283mm";page.style.overflow="hidden";page.style.background="#fff";page.style.color="#332c25";page.style.fontFamily='"Yu Gothic",sans-serif';
       document.getElementById("count").textContent=`${current+1} / ${snapshots.length} ページ`;
       document.getElementById("prev").disabled=current===0;document.getElementById("next").disabled=current===snapshots.length-1;
       document.getElementById("pager").hidden=snapshots.length<=1;fit();window.scrollTo({top:0,behavior:"instant"});
     }
     // Copy print-only CSS rules into screen scope for the generated pv2 DOM.
     for(const sheet of [...doc.styleSheets]){
       let rules;try{rules=[...sheet.cssRules]}catch{continue}
       for(const rule of rules){
         if(rule.type===CSSRule.MEDIA_RULE&&[...rule.media].some(m=>m==="print")){
           const st=document.createElement("style");st.textContent=[...rule.cssRules].map(r=>r.cssText).join("\n").replace(/body>main\.app\{[^}]*\}/g,"");document.head.appendChild(st);
         }
       }
     }
     document.getElementById("prev").onclick=()=>show(current-1);document.getElementById("next").onclick=()=>show(current+1);window.addEventListener("resize",fit,{passive:true});
     show(0);loading.remove();sessionStorage.removeItem(KEY);
   }catch(e){console.error(e);loading.textContent="印刷プレビュー形式の譜面を生成できませんでした。";}
 });
})();
</script></body></html>
