<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>文化譜を見る｜文化譜面帳</title><style>html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#e5ded3}#loading{position:fixed;inset:0;display:grid;place-items:center;font-family:"Yu Gothic",sans-serif;color:#5f554c;background:#e5ded3;z-index:2}iframe{display:block;border:0;width:100%;height:100%;background:white}</style></head><body><div id="loading">文化譜を表示しています…</div><iframe id="viewer" title="文化譜を見る"></iframe><script>
(async()=>{const KEY="shian-scorebook-view-score",EDITOR_URL="https://itohen0716.github.io/sianhu-main/",raw=sessionStorage.getItem(KEY),frame=document.getElementById("viewer"),loading=document.getElementById("loading");if(!raw){loading.textContent="表示する文化譜が選択されていません。";return}let payload;try{payload=JSON.parse(raw)}catch{loading.textContent="文化譜データを読み込めませんでした。";return}const score=payload&&payload.score&&typeof payload.score==="object"?payload.score:payload;
try{localStorage.setItem("shian-bunkafu-editor-v2",JSON.stringify(score));const res=await fetch(EDITOR_URL,{cache:"no-store"});if(!res.ok)throw new Error();let html=await res.text();html=html.replace(/<head([^>]*)>/i,'<head$1><base href="'+EDITOR_URL+'">');frame.srcdoc=html}catch(e){console.error(e);loading.textContent="文化譜を表示できませんでした。";return}
frame.addEventListener("load",()=>{try{const doc=frame.contentDocument,win=frame.contentWindow;if(!doc||!win)throw new Error();const style=doc.createElement("style");style.textContent=`.scorebook-view-header{height:58px;background:#fffaf3;border-bottom:1px solid #d8cbbd;display:flex;align-items:center;justify-content:space-between;width:min(1160px,calc(100% - 28px));margin:0 auto;padding:7px 14px;box-sizing:border-box;position:relative;z-index:2147483646}.scorebook-view-header strong{font-family:"Yu Mincho",serif;font-size:19px}.scorebook-view-header button{border:1px solid #abc2ca;border-radius:9px;background:#e9f1f3;color:#315f70;font-weight:700;padding:8px 13px;cursor:pointer}.scorebook-view-lock .score-toolbar,.scorebook-view-lock aside,.scorebook-view-lock .editor-switcher,.scorebook-view-lock .layer-panel,.scorebook-view-lock .note-color-panel,.scorebook-view-lock .bottom{display:none!important}.scorebook-view-lock input,.scorebook-view-lock select,.scorebook-view-lock textarea{pointer-events:none!important}`;doc.head.appendChild(style);doc.body.classList.add("scorebook-view-lock");const h=doc.createElement("header");h.className="scorebook-view-header";h.innerHTML='<strong>文化譜を見る</strong><button type="button">← 文化譜面帳へ戻る</button>';doc.body.prepend(h);h.querySelector("button").onclick=()=>location.href="./index.html";win.localStorage.setItem("shian-bunkafu-editor-v2",JSON.stringify(score));win.dispatchEvent(new win.Event("pageshow"));loading.remove();sessionStorage.removeItem(KEY)}catch(e){console.error(e);loading.textContent="文化譜の表示準備に失敗しました。"}})})();
</script></body></html>
